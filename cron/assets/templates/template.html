<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily Bread - Devocional</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Email client resets and global styles */
      body {
        margin: 0;
        padding: 0;
        background-color: #fafafa;
        font-family: "JetBrains Mono", "Fira Code", "Courier New", monospace;
        color: #111111;
        -webkit-font-smoothing: antialiased;
      }
      table {
        border-collapse: collapse;
        border-spacing: 0;
      }
      img {
        border: 0;
        max-width: 100%;
        height: auto;
      }
      a {
        color: #aa820a;
        text-decoration: none;
        border-bottom: 1px dashed #d4af37;
      }
      a:hover {
        color: #d4af37;
        border-bottom: 1px solid #d4af37;
      }

      /* Typography & layout overrides */
      .content {
        font-size: 15px;
        line-height: 1.7;
        text-align: left;
      }
      .content h1 {
        font-family: "JetBrains Mono", "Fira Code", monospace;
        font-size: 22px;
        color: #111111;
        margin-top: 30px;
        margin-bottom: 15px;
        font-weight: 700;
        letter-spacing: -0.5px;
      }
      .content h1::before {
        content: "$ ";
        color: #d4af37;
      }
      .content h2 {
        font-family: "JetBrains Mono", "Fira Code", monospace;
        font-size: 18px;
        color: #aa820a;
        margin-top: 30px;
        margin-bottom: 15px;
        font-weight: 700;
      }
      .content h2::before {
        content: "> ";
        color: #d4af37;
      }
      .content h3 {
        font-family: "JetBrains Mono", "Fira Code", monospace;
        font-size: 16px;
        color: #111111;
        margin-top: 25px;
        margin-bottom: 10px;
        font-weight: 700;
      }
      .content h3::before {
        content: "* ";
        color: #d4af37;
      }
      .content p {
        margin-bottom: 18px;
      }
      .content blockquote {
        border-left: 2px solid #d4af37;
        background-color: #fafafa;
        margin: 25px 0;
        padding: 15px 20px;
        font-style: italic;
        color: #444444;
      }
      .content blockquote::before {
        content: "/* ";
        color: #888888;
        display: block;
        font-size: 12px;
        margin-bottom: 8px;
        font-family: "JetBrains Mono", monospace;
        font-weight: normal;
        font-style: normal;
      }
      .content blockquote::after {
        content: " */";
        color: #888888;
        display: block;
        font-size: 12px;
        margin-top: 8px;
        font-family: "JetBrains Mono", monospace;
        font-weight: normal;
        font-style: normal;
      }
      .content blockquote p {
        margin: 0;
      }
      /* Custom list style */
      .content ul {
        padding-left: 0;
        list-style-type: none;
      }
      .content ul li {
        margin-bottom: 8px;
        position: relative;
        padding-left: 20px;
      }
      .content ul li::before {
        content: "*";
        color: #d4af37;
        font-size: 14px;
        position: absolute;
        left: 0;
        top: 0;
      }
      .content hr {
        border: 0;
        height: 1px;
        border-top: 1px dashed #e5d8b8;
        margin: 30px 0;
      }
    </style>
  </head>
  <body>
    <table
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background-color: #fafafa; padding: 40px 0"
    >
      <tr>
        <td align="center">
          <!-- Main Container -->
          <table
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="
              width: 100%;
              max-width: 680px;
              background-color: #ffffff;
              border: 1px solid #e5d8b8;
            "
          >
            <!-- Decorative Gold Top Line -->
            <tr>
              <td
                height="3"
                style="background-color: #d4af37; font-size: 0; line-height: 0"
              ></td>
            </tr>

            <!-- Header -->
            <tr>
              <td align="left" style="padding: 40px 40px 20px 40px">
                <div style="font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11px; color: #888888; margin-bottom: 5px; letter-spacing: 1px;">
                  // SOLOMON SCHEDULER
                </div>
                <h1 style="font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 26px; font-weight: 700; margin: 0 0 10px 0; color: #111111; letter-spacing: -1px;">
                  daily-bread.sh
                </h1>
                <div style="font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12px; color: #d4af37;">
                  [DATE: {{date}}] [STATUS: COMPLETED]
                </div>
              </td>
            </tr>

            <!-- Divider -->
            <tr>
              <td style="padding: 0 40px">
                <table
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  style="border-top: 1px dashed #d4af37"
                >
                  <tr>
                    <td height="1"></td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Body Content -->
            <tr>
              <td style="padding: 30px 40px 40px 40px; background-color: #ffffff">
                <div class="content">{{content}}</div>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td
                align="left"
                style="padding: 35px 40px; border-top: 1px dashed #e5d8b8; background-color: #ffffff"
              >
                <div
                  style="
                    font-family: 'JetBrains Mono', 'Fira Code', monospace;
                    font-size: 14px;
                    color: #d4af37;
                    margin-bottom: 5px;
                    font-weight: 700;
                  "
                >
                  Sola Scriptura
                </div>
                <p
                  style="
                    font-family: 'JetBrains Mono', 'Fira Code', monospace;
                    font-size: 11px;
                    color: #888888;
                    line-height: 1.6;
                    margin: 0;
                  "
                >
                  /* Porque dele, por ele e para ele são todas as coisas; <br />
                     a ele seja a glória eternamente. Amém. - Romanos 11:36 */
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
