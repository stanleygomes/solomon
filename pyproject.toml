[project]
name = "solomon"
version = "0.1.0"
description = "Solomon - Personal assistant"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "textual>=8.2.7",
    "loguru>=0.7.3",
    "python-dotenv>=1.0.1",
    "jinja2>=3.1.6",
    "peewee>=4.0.6",
    "markdown-it-py>=4.2.0",
    "fastapi>=0.136.3",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.14",
    "textual-dev>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/infra", "src/cli", "src/api"]

[tool.ruff]
indent-width = 2
line-length = 88

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
