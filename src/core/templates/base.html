<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{title}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      {{ css_content }}
    </style>
  </head>
  <body>
    <table
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      class="outer-wrapper"
    >
      <tr>
        <td align="center">
          <!-- Main Container -->
          <table
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            class="container-wrapper"
          >
            <!-- Decorative Top Line -->
            <tr>
              <td
                height="3"
                class="gold-top-line"
              ></td>
            </tr>

            <!-- Header -->
            <tr>
              <td align="left" class="header-cell">
                <div class="header-subtitle">
                  // SOLOMON AGENT
                </div>
                <h1 class="header-title">
                  {{use_case}}.solomon.sh
                </h1>
                <div class="header-meta">
                  [DATE: {% raw %}{{date}}{% endraw %}] [STATUS: COMPLETED]
                </div>
              </td>
            </tr>

            <!-- Divider -->
            <tr>
              <td class="divider-cell">
                <table
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  class="divider-table"
                >
                  <tr>
                    <td height="1"></td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Body Content -->
            <tr>
              <td class="content-cell">
                <div class="content">{% raw %}{{content | safe}}{% endraw %}</div>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td align="left" class="footer-cell">
                <div class="footer-title">
                  Sola Scriptura
                </div>
                <p class="footer-text">
                  /* Porque dele, por ele e para ele são todas as coisas;
                  a ele seja a glória eternamente. - Romanos 11:36 */
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
