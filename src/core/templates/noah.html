<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{script_description}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Email client resets and global styles */
      body {
        margin: 0;
        padding: 0;
        background-color: #0c0f0e;
        font-family: "JetBrains Mono", "Fira Code", "Courier New", monospace;
        color: #d1e0d7;
        -webkit-font-smoothing: antialiased;
      }
      table {
        border-collapse: collapse;
        border-spacing: 0;
      }
      img {
        border: 0;
        max-width: 100%;
        height: auto;
      }
      a {
        color: #39ff14;
        text-decoration: none;
        border-bottom: 1px dashed #1f2e26;
      }
      a:hover {
        color: #2ecc71;
        border-bottom: 1px solid #2ecc71;
      }

      /* Typography & layout overrides */
      .content {
        font-size: 15px;
        line-height: 1.7;
        text-align: left;
      }
      .content h1 {
        font-family: "JetBrains Mono", "Fira Code", monospace;
        font-size: 22px;
        color: #39ff14;
        margin-top: 30px;
        margin-bottom: 15px;
        font-weight: 700;
        letter-spacing: -0.5px;
      }
      .content h1::before {
        content: "$ ";
        color: #2ecc71;
      }
      .content h2 {
        font-family: "JetBrains Mono", "Fira Code", monospace;
        font-size: 18px;
        color: #2ecc71;
        margin-top: 30px;
        margin-bottom: 15px;
        font-weight: 700;
      }
      .content h2::before {
        content: "> ";
        color: #39ff14;
      }
      .content h3 {
        font-family: "JetBrains Mono", "Fira Code", monospace;
        font-size: 16px;
        color: #d1e0d7;
        margin-top: 25px;
        margin-bottom: 10px;
        font-weight: 700;
      }
      .content h3::before {
        content: "* ";
        color: #39ff14;
      }
      .content p {
        margin-bottom: 18px;
      }
      .content blockquote {
        border-left: 2px solid #39ff14;
        background-color: #161e1a;
        margin: 25px 0;
        padding: 15px 20px;
        font-style: italic;
        color: #a3beb0;
      }
      .content blockquote::before {
        content: "/* ";
        color: #5c7a6b;
        display: block;
        font-size: 12px;
        margin-bottom: 8px;
        font-family: "JetBrains Mono", monospace;
        font-weight: normal;
        font-style: normal;
      }
      .content blockquote::after {
        content: " */";
        color: #5c7a6b;
        display: block;
        font-size: 12px;
        margin-top: 8px;
        font-family: "JetBrains Mono", monospace;
        font-weight: normal;
        font-style: normal;
      }
      .content blockquote p {
        margin: 0;
      }
      /* Custom list style */
      .content ul {
        padding-left: 0;
        list-style-type: none;
      }
      .content ul li {
        margin-bottom: 8px;
        position: relative;
        padding-left: 20px;
      }
      .content ul li::before {
        content: "*";
        color: #39ff14;
        font-size: 14px;
        position: absolute;
        left: 0;
        top: 0;
      }
      .content hr {
        border: 0;
        height: 1px;
        border-top: 1px dashed #1f2e26;
        margin: 30px 0;
      }

      /* Layout & structural classes */
      .outer-wrapper {
        background-color: #0c0f0e;
        padding: 40px 0;
      }
      .container-wrapper {
        width: 100%;
        max-width: 680px;
        background-color: #121614;
        border: 1px solid #1f2e26;
      }
      .green-top-line {
        background-color: #39ff14;
        font-size: 0;
        line-height: 0;
      }
      .header-cell {
        padding: 40px 20px;
      }
      .header-subtitle {
        font-size: 11px;
        color: #5c7a6b;
        margin-bottom: 5px;
        letter-spacing: 1px;
      }
      .header-title {
        font-size: 26px;
        font-weight: 700;
        margin: 0 0 10px 0;
        color: #39ff14;
        letter-spacing: -1px;
      }
      .header-meta {
        font-size: 12px;
        color: #2ecc71;
      }
      .divider-cell {
        padding: 0 20px;
      }
      .divider-table {
        border-top: 1px dashed #1f2e26;
      }
      .content-cell {
        padding: 30px 20px 40px 20px;
        background-color: #121614;
      }
      .footer-cell {
        padding: 35px 20px;
        border-top: 1px dashed #1f2e26;
        background-color: #121614;
      }
      .footer-title {
        font-size: 14px;
        color: #39ff14;
        margin-bottom: 5px;
        font-weight: 700;
      }
      .footer-text {
        font-size: 11px;
        color: #5c7a6b;
      }
    </style>
  </head>
  <body>
    <table
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      class="outer-wrapper"
    >
      <tr>
        <td align="center">
          <!-- Main Container -->
          <table
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            class="container-wrapper"
          >
            <!-- Decorative Green Top Line -->
            <tr>
              <td
                height="3"
                class="green-top-line"
              ></td>
            </tr>

            <!-- Header -->
            <tr>
              <td align="left" class="header-cell">
                <div class="header-subtitle">
                  // SOLOMON SCHEDULER
                </div>
                <h1 class="header-title">
                  daily-bread.sh
                </h1>
                <div class="header-meta">
                  [DATE: {{date}}] [STATUS: COMPLETED]
                </div>
              </td>
            </tr>

            <!-- Divider -->
            <tr>
              <td class="divider-cell">
                <table
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  class="divider-table"
                >
                  <tr>
                    <td height="1"></td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Body Content -->
            <tr>
              <td class="content-cell">
                <div class="content">{{content}}</div>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td align="left" class="footer-cell">
                <div class="footer-title">
                  Sola Scriptura
                </div>
                <p class="footer-text">
                  /* Porque dele, por ele e para ele são todas as coisas;
                  a ele seja a glória eternamente. - Romanos 11:36 */
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
